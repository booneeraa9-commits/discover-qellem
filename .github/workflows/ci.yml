name: Continuous integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      database:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: discover_qellem
          POSTGRES_USER: discover_qellem
          POSTGRES_PASSWORD: ci-postgres-password-not-for-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U discover_qellem -d discover_qellem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s

    env:
      DJANGO_SETTINGS_MODULE: qellem_cms.settings.dev
      DJANGO_SECRET_KEY: ci-only-django-key-never-use-in-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      WAGTAILADMIN_BASE_URL: http://localhost:8000
      WAGTAIL_SITE_NAME: Discover Qellem
      POSTGRES_DB: discover_qellem
      POSTGRES_USER: discover_qellem
      POSTGRES_PASSWORD: ci-postgres-password-not-for-production
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_CONN_MAX_AGE: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    defaults:
      run:
        working-directory: apps/cms

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/cms/requirements.txt

      - name: Install locked backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify backend dependencies
        run: python -m pip check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run database-aware system checks
        run: python manage.py check --database default

      - name: Run backend tests
        run: python manage.py test --verbosity 2

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked frontend dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  container:
    name: CMS container checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    env:
      POSTGRES_DB: discover_qellem
      POSTGRES_USER: discover_qellem
      POSTGRES_PASSWORD: ci-postgres-password-not-for-production
      POSTGRES_HOST_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build production CMS image
        run: docker build --tag discover-qellem-cms:ci apps/cms

      - name: Verify non-root container user
        run: |
          test "$(docker image inspect discover-qellem-cms:ci --format '{{.Config.User}}')" = "qellem"

      - name: Verify Gunicorn runtime
        run: docker run --rm --entrypoint gunicorn discover-qellem-cms:ci --version

      - name: Verify container command has no automatic migration
        run: |
          command="$(docker image inspect discover-qellem-cms:ci --format '{{json .Config.Cmd}}')"
          printf '%s\n' "$command"
          case "$command" in
            *gunicorn*) ;;
            *)
              echo "The runtime command does not start Gunicorn." >&2
              exit 1
              ;;
          esac
          case "$command" in
            *migrate*)
              echo "The runtime command must not apply migrations automatically." >&2
              exit 1
              ;;
          esac
