name: Bug report
description: Something is broken or rendering incorrectly
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Before submitting, check that the issue hasn't already been reported.
  - type: dropdown
    id: area
    attributes:
      label: Where is the bug?
      options:
        - Frontend (Next.js / web UI)
        - Backend / CMS (Django/Wagtail)
        - Infrastructure / Docker / deploy
        - Content (text, photo, translation)
        - PWA / offline / install
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: URL / route / page
      description: e.g. `/place/dembi-dollo`, Wagtail admin `/admin/pages/.../edit/`
      placeholder: "/..."
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser / device
      options:
        - Chrome desktop
        - Firefox desktop
        - Safari desktop
        - Chrome on Android
        - Safari on iOS
        - Other
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - Light mode
        - Dark mode
        - Both
  - type: dropdown
    id: lang
    attributes:
      label: Language
      options:
        - English
        - Afaan Oromoo
        - Both
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. See error
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / logs
      description: Paste screenshots, console errors, or Django tracebacks.
  - type: textarea
    id: notes
    attributes:
      label: Additional context
