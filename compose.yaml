services:
  database:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    shm_size: 128mb
    restart: unless-stopped
    stop_grace_period: 30s

  cms:
    build:
      context: ./apps/cms
    depends_on:
      database:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: qellem_cms.settings.dev
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,cms}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      WAGTAILADMIN_BASE_URL: ${WAGTAILADMIN_BASE_URL:-http://localhost:8000}
      WAGTAIL_SITE_NAME: ${WAGTAIL_SITE_NAME:-Discover Qellem}
      DJANGO_CORS_ENABLED: ${DJANGO_CORS_ENABLED:-true}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: ${POSTGRES_HOST:-database}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_CONN_MAX_AGE: ${POSTGRES_CONN_MAX_AGE:-0}
      POSTGRES_STARTUP_TIMEOUT: ${POSTGRES_STARTUP_TIMEOUT:-60}
    ports:
      - "127.0.0.1:${CMS_HOST_PORT:-8000}:8000"
    volumes:
      - cms_static:/app/static
      - cms_media:/app/media
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_CMS_URL: ${NEXT_PUBLIC_CMS_URL:-http://localhost:8000}
    depends_on:
      cms:
        condition: service_started
    environment:
      CMS_API_URL: ${CMS_API_URL:-http://cms:8000/api/v2/}
      NEXT_PUBLIC_CMS_URL: ${NEXT_PUBLIC_CMS_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  cms_static:
  cms_media:
